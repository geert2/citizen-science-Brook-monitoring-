<text x="18" y="580" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">ECHO is a 5 V signal: the 1 kΩ / 2 kΩ divider brings</text>
<text x="18" y="598" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">it to 3.3 V before it reaches GPIO7.</text>
<text x="18" y="616" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">DS18B20 wires: red = VCC, yellow = DATA, black = GND.</text>
<text x="18" y="634" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">All ground symbols are the same GND wire.</text>
<text x="18" y="652" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">5 V = output of MT3608 #1 (diagram 2).</text>
