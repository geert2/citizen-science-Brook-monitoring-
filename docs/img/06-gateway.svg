<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" width="420" height="580" font-family="Helvetica, Arial, sans-serif">
<title>6 · Gateway (mains USB)</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="1.5" y="1.5" width="417" height="577" rx="10" fill="none" stroke="#d0d0d0" stroke-width="2"/>
<text x="210.0" y="28" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f1f1f">6 · Gateway (mains USB)</text>
<rect x="30" y="60" width="150" height="56" rx="8" fill="#fff8e6" stroke="#555555" stroke-width="2"/>
<text x="105" y="85" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f1f1f">Water node</text>
<text x="105" y="103" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">at the brook</text>
<polyline points="105,116 105,205 230,205 230,250" fill="none" stroke="#0a9396" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<text x="192" y="196" font-size="12" text-anchor="middle" font-weight="bold" fill="#0a9396">LoRa radio 869.5 MHz</text>
<polyline points="330,250 330,150" fill="none" stroke="#1f1f1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="330" cy="146" r="7" fill="#1f1f1f"/>
<text x="330" y="112" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f1f1f">868 MHz antenna</text>
<text x="330" y="128" font-size="11" text-anchor="middle" font-weight="normal" fill="#d62828">attach BEFORE power!</text>
<rect x="180" y="250" width="200" height="90" rx="8" fill="#e6f7ea" stroke="#2a9d3f" stroke-width="2"/>
<text x="280" y="284" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f1f1f">Heltec V3</text>
<text x="280" y="302" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">gateway · always listening</text>
<text x="280" y="322" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">antenna on the SMA socket</text>
<circle cx="330" cy="250" r="4.5" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<rect x="30" y="430" width="140" height="50" rx="8" fill="#eef3f8" stroke="#555555" stroke-width="2"/>
<text x="100" y="451" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f1f1f">5 V USB charger</text>
<text x="100" y="468" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">mains</text>
<polyline points="100,430 100,385 230,385 230,340" fill="none" stroke="#d62828" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="230" cy="340" r="4.5" fill="#ffffff" stroke="#d62828" stroke-width="2.5"/>
<text x="165" y="377" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">USB-C cable</text>
<polyline points="340,340 340,430" fill="none" stroke="#1d6fdc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<circle cx="340" cy="340" r="4.5" fill="#ffffff" stroke="#1d6fdc" stroke-width="2.5"/>
<text x="352" y="392" font-size="12" text-anchor="start" font-weight="bold" fill="#1d6fdc">Wi-Fi</text>
<rect x="270" y="430" width="130" height="50" rx="8" fill="#e8f1ff" stroke="#1d6fdc" stroke-width="2"/>
<text x="335" y="451" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f1f1f">Router</text>
<text x="335" y="468" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">→ Home Assistant</text>
<text x="18" y="515" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">Dashed lines = wireless. Never power the Heltec</text>
<text x="18" y="533" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">without its antenna attached.</text>
<line x1="18" y1="554" x2="34" y2="554" stroke="#d62828" stroke-width="4" stroke-linecap="round"/>
<text x="39" y="558" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">power</text>
<line x1="85.0" y1="554" x2="101.0" y2="554" stroke="#0a9396" stroke-width="4" stroke-linecap="round"/>
<text x="106.0" y="558" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">radio</text>
<line x1="152.0" y1="554" x2="168.0" y2="554" stroke="#1d6fdc" stroke-width="4" stroke-linecap="round"/>
<text x="173.0" y="558" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">Wi-Fi</text>
</svg>
