<line x1="143.5" y1="421" x2="156.5" y2="421" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="147" y1="426" x2="153" y2="426" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<text x="202" y="340" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">10 kΩ</text>
<text x="160" y="392" font-size="11" text-anchor="start" font-weight="normal" fill="#1f1f1f">10 kΩ</text>
<polyline points="250,372 222,372" fill="none" stroke="#d62828" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="250" cy="372" r="4.5" fill="#ffffff" stroke="#d62828" stroke-width="2.5"/>
<text x="216" y="376" font-size="12" text-anchor="end" font-weight="bold" fill="#d62828">5 V</text>
<polyline points="250,392 222,392" fill="none" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="250" cy="392" r="4.5" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<line x1="212" y1="396" x2="232" y2="396" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="215.5" y1="401" x2="228.5" y2="401" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="219" y1="406" x2="225" y2="406" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<text x="18" y="480" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• 15 V = MT3608 #2, 5 V = MT3608 #1 (diagram 2).</text>
<text x="18" y="498" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• The 10 kΩ / 10 kΩ divider halves the 4.5 V output so</text>
<text x="18" y="516" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">  the ADS1115 (3.3 V supply) is never overloaded.</text>
<text x="18" y="534" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• The ADS reads A2 = half the sensor voltage;</text>
<text x="18" y="552" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">  the gateway multiplies it by 2 again.</text>
<text x="18" y="570" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• SEN0189: set the small slide switch to ANALOG.</text>
<text x="18" y="588" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• Check the silkscreen on your boards for pin order.</text>
<text x="18" y="606" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• Ground symbols are all the same GND wire.</text>
<line x1="18" y1="624" x2="34" y2="624" stroke="#8a3ffc" stroke-width="4" stroke-linecap="round"/>
<text x="39" y="628" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">15 V</text>
<line x1="78.6" y1="624" x2="94.6" y2="624" stroke="#d62828" stroke-width="4" stroke-linecap="round"/>
<text x="99.6" y="628" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">5 V</text>
<line x1="132.8" y1="624" x2="148.8" y2="624" stroke="#1f1f1f" stroke-width="4" stroke-linecap="round"/>
<text x="153.8" y="628" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">GND</text>
<line x1="187.0" y1="624" x2="203.0" y2="624" stroke="#1d6fdc" stroke-width="4" stroke-linecap="round"/>
<text x="208.0" y="628" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">analog signal</text>
</svg>
