<text x="65" y="113" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">3V3 + GND,</text>
<text x="65" y="128" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">SDA + SCL</text>
<text x="65" y="143" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">(diagram 3)</text>
<text x="105" y="154" font-size="12" text-anchor="end" font-weight="bold" fill="#1f1f1f">A0</text>
