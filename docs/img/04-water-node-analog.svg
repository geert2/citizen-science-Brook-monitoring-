<text x="202" y="138" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">1 kΩ</text>
<text x="130" y="190" font-size="11" text-anchor="start" font-weight="normal" fill="#555555">A0 reads the voltage across 160 Ω:</text>
<text x="130" y="205" font-size="11" text-anchor="start" font-weight="normal" fill="#555555">0.64 V (4 mA) … 3.2 V (20 mA)</text>
<rect x="250" y="222" width="150" height="78" rx="8" fill="#fff8e6" stroke="#555555" stroke-width="2"/>
<text x="335" y="252" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f1f1f">SEN0244</text>
<text x="335" y="269" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">TDS / EC</text>
<text x="335" y="285" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">out: 0–2.3 V</text>
<text x="258" y="244" font-size="11" text-anchor="start" font-weight="normal" fill="#1f1f1f">A</text>
<text x="258" y="264" font-size="12" text-anchor="start" font-weight="bold" fill="#1f1f1f">+</text>
<text x="258" y="284" font-size="12" text-anchor="start" font-weight="bold" fill="#1f1f1f">−</text>
