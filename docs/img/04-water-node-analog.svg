<text x="378" y="144" font-size="11" text-anchor="start" font-weight="normal" fill="#555555">shunt</text>
<polyline points="310,82 310,150 225,150" fill="none" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
