<polyline points="365,140 365,166" fill="none" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="355" y1="170" x2="375" y2="170" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="358.5" y1="175" x2="371.5" y2="175" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
