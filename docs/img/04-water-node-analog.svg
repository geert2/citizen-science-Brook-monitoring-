<circle cx="250" cy="282" r="4.5" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<line x1="212" y1="286" x2="232" y2="286" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="215.5" y1="291" x2="228.5" y2="291" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="219" y1="296" x2="225" y2="296" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<rect x="250" y="332" width="150" height="78" rx="8" fill="#fff8e6" stroke="#555555" stroke-width="2"/>
<text x="335" y="362" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f1f1f">SEN0189</text>
<text x="335" y="379" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">turbidity</text>
<text x="335" y="395" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">out: up to 4.5 V</text>
<text x="258" y="354" font-size="11" text-anchor="start" font-weight="normal" fill="#1f1f1f">OUT</text>
<text x="258" y="374" font-size="12" text-anchor="start" font-weight="bold" fill="#1f1f1f">+</text>
<text x="258" y="394" font-size="12" text-anchor="start" font-weight="bold" fill="#1f1f1f">−</text>
<circle cx="250" cy="350" r="4.5" fill="#ffffff" stroke="#1d6fdc" stroke-width="2.5"/>
<polyline points="250,350 214,350" fill="none" stroke="#1d6fdc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="190" y="344" width="24" height="12" rx="2" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
<polyline points="190,350 115,350" fill="none" stroke="#1d6fdc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="150" cy="350" r="4.5" fill="#1d6fdc"/>
<polyline points="150,350 150,374" fill="none" stroke="#1d6fdc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="144" y="374" width="12" height="24" rx="2" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
<polyline points="150,398 150,412" fill="none" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
