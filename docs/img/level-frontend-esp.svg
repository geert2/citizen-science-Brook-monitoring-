<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Arial, Helvetica, sans-serif">
<rect width="960" height="580" fill="#ffffff"/>
<text x="24" y="34" font-size="20" text-anchor="start" font-weight="bold" fill="#222">Level channel (TL-136 0-2 m) - ESP32-S3 built-in ADC</text>
<text x="24" y="56" font-size="13" text-anchor="start" font-weight="normal" fill="#555">Shunt resistor turns the 4-20 mA loop current into a voltage; the clamp protects GPIO5.</text>
<rect x="40" y="80" width="170" height="60" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
<text x="125" y="105" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">MT3608 boost</text>
<text x="125" y="125" font-size="13" text-anchor="middle" font-weight="normal" fill="#222">OUT+ = 18.0 V</text>
<line x1="210" y1="110" x2="330" y2="110" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round"/>
<text x="270" y="102" font-size="12" text-anchor="middle" font-weight="normal" fill="#d32f2f">18 V</text>
<rect x="330" y="70" width="170" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="415" y="98" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">TL-136</text>
<text x="415" y="116" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">level transmitter</text>
<text x="415" y="134" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">2-wire, 4-20 mA</text>
<text x="322" y="128" font-size="11" text-anchor="end" font-weight="normal" fill="#222">V+ (red)</text>
<text x="415" y="172" font-size="11" text-anchor="middle" font-weight="normal" fill="#1565c0">Out (blue)</text>
<line x1="415" y1="180" x2="415" y2="250" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="415" cy="250" r="4.5" fill="#1565c0"/>
<line x1="415" y1="250" x2="415" y2="315.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="415" y1="375.0" x2="415" y2="440" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<rect x="405" y="315.0" width="20" height="60" rx="2" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="397" y="343.0" font-size="12" text-anchor="end" font-weight="normal" fill="#222">100 ohm</text>
<text x="397" y="358.0" font-size="12" text-anchor="end" font-weight="normal" fill="#222">0.1 % shunt</text>
<text x="397" y="373.0" font-size="12" text-anchor="end" font-weight="normal" fill="#222">(160 ohm also</text>
<text x="397" y="388.0" font-size="12" text-anchor="end" font-weight="normal" fill="#222">works &lt; 4.8 m)</text>
<line x1="415" y1="250" x2="470" y2="250" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<line x1="470" y1="250" x2="505.0" y2="250" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<line x1="565.0" y1="250" x2="600" y2="250" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<rect x="505.0" y="240" width="60" height="20" rx="2" fill="#fff" stroke="#1565c0" stroke-width="2"/>
<text x="535.0" y="234" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">1 kohm</text>
<line x1="600" y1="250" x2="660" y2="250" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="660" cy="250" r="4.5" fill="#1565c0"/>
<line x1="660" y1="250" x2="800" y2="250" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="740" cy="250" r="4.5" fill="#1565c0"/>
<line x1="660" y1="250" x2="660" y2="333.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="660" y1="357.0" x2="660" y2="440" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<polyline points="648,357.0 672,357.0 660,333.0" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="646,328.0 648,333.0 672,333.0 674,338.0" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="638" y="343.0" font-size="12" text-anchor="end" font-weight="normal" fill="#222">3.6 V zener</text>
<text x="638" y="358.0" font-size="12" text-anchor="end" font-weight="normal" fill="#222">or BAT54S</text>
<text x="638" y="373.0" font-size="12" text-anchor="end" font-weight="normal" fill="#222">(to 3V3 + GND)</text>
<line x1="740" y1="250" x2="740" y2="340.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="740" y1="350.0" x2="740" y2="440" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="726" y1="340.0" x2="754" y2="340.0" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<line x1="726" y1="350.0" x2="754" y2="350.0" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<text x="760" y="349.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">100 nF</text>
<line x1="415" y1="440" x2="740" y2="440" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="415" cy="440" r="4.5" fill="#222"/>
<circle cx="660" cy="440" r="4.5" fill="#222"/>
<circle cx="740" cy="440" r="4.5" fill="#222"/>
<line x1="577" y1="440" x2="577" y2="450" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="563" y1="450" x2="591" y2="450" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="568" y1="456" x2="586" y2="456" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="573" y1="462" x2="581" y2="462" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<rect x="800" y="220" width="130" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="865" y="246" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">ESP32-S3</text>
<text x="865" y="264" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">GPIO5 (ADC1)</text>
<text x="400" y="244" font-size="12" text-anchor="end" font-weight="normal" fill="#1565c0">0.4 - 2.0 V</text>
<text x="24" y="500" font-size="13" text-anchor="start" font-weight="normal" fill="#222">With 100 ohm: 4 mA = 0.40 V (0 m) and 20 mA = 2.00 V (2 m). Valid window 3.5 - 22 mA; outside it the node reports "unavailable".</text>
<text x="24" y="524" font-size="13" text-anchor="start" font-weight="normal" fill="#222">If the transmitter ever shorts onto the 18 V rail, the zener holds GPIO5 near 3.6 V and the 1 kohm limits the current to about 15 mA.</text>
<text x="24" y="548" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Measure your real shunt value and set shunt_ohm in the node YAML. Never connect GPIO5 straight to the transmitter output.</text>
</svg>
