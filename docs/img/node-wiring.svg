<circle cx="450" cy="730" r="4.5" fill="#2e7d32"/>
<text x="442" y="734" font-size="12" text-anchor="end" font-weight="bold" fill="#222">GPIO41</text>
<circle cx="450" cy="770" r="4.5" fill="#ef6c00"/>
<text x="442" y="774" font-size="12" text-anchor="end" font-weight="bold" fill="#222">GPIO42</text>
<line x1="450" y1="170" x2="520" y2="170" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="520" y1="170" x2="520" y2="700" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="520" cy="170" r="4.5" fill="#d32f2f"/>
