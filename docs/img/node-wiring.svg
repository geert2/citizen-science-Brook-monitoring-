<text x="855" y="152" font-size="11" text-anchor="middle" font-weight="normal" fill="#d32f2f">18 V</text>
<rect x="900" y="120" width="210" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="1005" y="145" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">TL-136 transmitter (0-2 m)</text>
<text x="1005" y="164" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">red = V+   blue = Out</text>
<text x="1005" y="182" font-size="11" text-anchor="middle" font-weight="normal" fill="#777">(vented cable, never cut)</text>
<line x1="1005" y1="200" x2="1005" y2="230" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<rect x="900" y="230" width="210" height="80" rx="8" fill="#fff" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1005" y="252" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">Level front end</text>
<text x="1005" y="270" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">100 ohm shunt + 1 kohm +</text>
<text x="1005" y="286" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">zener/clamp + 100 nF</text>
<text x="1005" y="302" font-size="11" text-anchor="middle" font-weight="normal" fill="#777">see level-frontend-esp.svg</text>
<line x1="900" y1="300" x2="450" y2="300" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<text x="780" y="292" font-size="12" text-anchor="middle" font-weight="normal" fill="#1565c0">signal to GPIO5 (0.4 - 2.0 V)</text>
<line x1="1110" y1="255" x2="1135" y2="255" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="1140" y="259" font-size="11" text-anchor="start" font-weight="normal" fill="#777">GND*</text>
