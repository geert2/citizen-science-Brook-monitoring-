<text x="725" y="175" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">set OUT+ = 18.0 V</text>
<line x1="520" y1="185" x2="640" y2="185" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="520" cy="185" r="4.5" fill="#d32f2f"/>
