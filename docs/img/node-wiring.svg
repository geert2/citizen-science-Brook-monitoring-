<text x="1005" y="505" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">DS18B20 probe</text>
<text x="908" y="514" font-size="11" text-anchor="start" font-weight="normal" fill="#222"></text>
<text x="1000" y="528" font-size="12" text-anchor="middle" font-weight="normal" fill="#d32f2f">red   = VCC</text>
<text x="1000" y="553" font-size="12" text-anchor="middle" font-weight="normal" fill="#a07800">yellow = DATA</text>
<text x="1000" y="593" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">black = GND</text>
<circle cx="690" cy="510" r="4.5" fill="#d32f2f"/>
<circle cx="690" cy="550" r="4.5" fill="#e0a100"/>
<line x1="690" y1="510" x2="690" y2="520" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
