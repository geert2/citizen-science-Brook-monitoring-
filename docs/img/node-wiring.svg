<text x="555" y="160" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">GND</text>
<rect x="640" y="130" width="170" height="110" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
