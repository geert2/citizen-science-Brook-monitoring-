<line x1="590" y1="210.0" x2="590" y2="225" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="576" y1="200.0" x2="604" y2="200.0" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<line x1="576" y1="210.0" x2="604" y2="210.0" stroke="#222" stroke-width="3" stroke-linecap="round"/>
