<line x1="590" y1="185" x2="590" y2="185" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="590" cy="185" r="4.5" fill="#d32f2f"/>
<circle cx="590" cy="225" r="4.5" fill="#222"/>
<text x="725" y="215" font-size="11" text-anchor="middle" font-weight="normal" fill="#777">OUT-: common</text>
