<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 890" width="1180" height="890" font-family="Arial, Helvetica, sans-serif">
<rect width="1180" height="890" fill="#ffffff"/>
<text x="24" y="34" font-size="20" text-anchor="start" font-weight="bold" fill="#222">Brook lite node - wiring overview (Heltec WiFi LoRa 32 V3)</text>
<text x="24" y="56" font-size="13" text-anchor="start" font-weight="normal" fill="#555">Red = switched 3.3 V (Vext), black = GND. Crossing wires are NOT connected unless a dot is drawn.</text>
<rect x="40" y="90" width="150" height="66" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="115" y="116" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">18650 Li-ion</text>
<text x="115" y="136" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">(protected cell)</text>
<line x1="190" y1="123" x2="240" y2="123" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round"/>
<text x="215" y="115" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">BAT</text>
<rect x="240" y="70" width="210" height="740" rx="8" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
<text x="345" y="98" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">Heltec V3</text>
<text x="345" y="116" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">ESP32-S3 + SX1262</text>
<text x="345" y="132" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">868 MHz LoRa</text>
<text x="250" y="350" font-size="12" text-anchor="start" font-weight="normal" fill="#777">GPIO36 switches Vext</text>
<text x="250" y="366" font-size="12" text-anchor="start" font-weight="normal" fill="#777">(LOW = sensors ON)</text>
<text x="250" y="392" font-size="12" text-anchor="start" font-weight="normal" fill="#777">GPIO1 + GPIO37: battery</text>
<text x="250" y="408" font-size="12" text-anchor="start" font-weight="normal" fill="#777">voltage (onboard divider)</text>
<text x="250" y="480" font-size="12" text-anchor="start" font-weight="normal" fill="#777">GPIO35 = status LED</text>
<text x="250" y="640" font-size="12" text-anchor="start" font-weight="bold" fill="#d32f2f">Attach the antenna before</text>
<text x="250" y="656" font-size="12" text-anchor="start" font-weight="bold" fill="#d32f2f">powering the board!</text>
<line x1="240" y1="730" x2="205" y2="730" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="205" y1="730" x2="205" y2="705" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
