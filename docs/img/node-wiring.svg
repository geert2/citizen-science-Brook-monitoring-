<text x="708" y="534" font-size="12" text-anchor="start" font-weight="normal" fill="#222">4.7 kohm</text>
<rect x="640" y="360" width="170" height="110" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
<text x="725" y="384" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">EC / TDS module</text>
<line x1="520" y1="390" x2="640" y2="390" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="520" cy="390" r="4.5" fill="#d32f2f"/>
<text x="648" y="394" font-size="11" text-anchor="start" font-weight="normal" fill="#222">VCC</text>
<line x1="555" y1="450" x2="640" y2="450" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="555" cy="450" r="4.5" fill="#222"/>
<text x="648" y="454" font-size="11" text-anchor="start" font-weight="normal" fill="#222">GND</text>
<line x1="640" y1="430" x2="450" y2="430" stroke="#6a1b9a" stroke-width="2.5" stroke-linecap="round"/>
<text x="648" y="434" font-size="11" text-anchor="start" font-weight="normal" fill="#222">AOUT</text>
<line x1="810" y1="415" x2="900" y2="415" stroke="#6a1b9a" stroke-width="2.5" stroke-linecap="round"/>
<text x="855" y="407" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">2 wires</text>
<rect x="900" y="375" width="210" height="80" rx="8" fill="#fff" stroke="#6a1b9a" stroke-width="2"/>
<text x="1005" y="402" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">EC probe</text>
<text x="1005" y="420" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">2 electrodes, cable extended</text>
<text x="1005" y="438" font-size="11" text-anchor="middle" font-weight="normal" fill="#777">(two-core twisted pair)</text>
<rect x="640" y="670" width="170" height="130" rx="8" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="725" y="694" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">BME280 air sensor</text>
<text x="725" y="712" font-size="11" text-anchor="middle" font-weight="normal" fill="#777">outside, in shield</text>
<line x1="520" y1="700" x2="640" y2="700" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="520" cy="700" r="4.5" fill="#d32f2f"/>
<text x="648" y="704" font-size="11" text-anchor="start" font-weight="normal" fill="#222">VIN</text>
<line x1="555" y1="720" x2="640" y2="720" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="555" cy="720" r="4.5" fill="#222"/>
<text x="648" y="724" font-size="11" text-anchor="start" font-weight="normal" fill="#222">GND</text>
<line x1="450" y1="730" x2="640" y2="730" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>
<text x="648" y="744" font-size="11" text-anchor="start" font-weight="normal" fill="#222">SDA</text>
<line x1="640" y1="730" x2="640" y2="740" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>
<line x1="450" y1="770" x2="640" y2="770" stroke="#ef6c00" stroke-width="2.5" stroke-linecap="round"/>
<text x="648" y="774" font-size="11" text-anchor="start" font-weight="normal" fill="#222">SCL</text>
<line x1="555" y1="720" x2="555" y2="720" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="24" y="862" font-size="12" text-anchor="start" font-weight="normal" fill="#555">* The shunt return goes to the GND rail (common with the boost IN-/OUT-).</text>
<text x="24" y="840" font-size="12" text-anchor="start" font-weight="normal" fill="#555">I2C bus on GPIO41/42 is separate from the onboard OLED; keep the BME280 cable under 1 m. All sensors are powered only while Vext is on (about 2-3 s per reading).</text>
</svg>
