<line x1="205" y1="705" x2="220" y2="690" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="205" y1="705" x2="205" y2="680" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="232" y="672" font-size="11" text-anchor="end" font-weight="normal" fill="#222">868 MHz antenna</text>
<circle cx="450" cy="170" r="4.5" fill="#d32f2f"/>
<text x="442" y="174" font-size="12" text-anchor="end" font-weight="bold" fill="#222">Vext</text>
<circle cx="450" cy="210" r="4.5" fill="#222"/>
<text x="442" y="214" font-size="12" text-anchor="end" font-weight="bold" fill="#222">GND</text>
<circle cx="450" cy="300" r="4.5" fill="#1565c0"/>
