<text x="18" y="540" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• SDS011: use the 4 wires 5V, GND, TXD, RXD of its cable.</text>
<text x="18" y="558" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• Crossed on purpose: TX of one side goes to RX of the other.</text>
<text x="18" y="576" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• BME280: SDO to GND gives address 0x76 (try 0x77 if not</text>
<text x="18" y="594" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">  found in the I2C scan).</text>
<text x="18" y="612" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• Inlet of the SDS011 pointing down, away from the box.</text>
