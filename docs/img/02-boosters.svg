<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 660" width="420" height="660" font-family="Helvetica, Arial, sans-serif">
<title>2 · Switched sensor power</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="1.5" y="1.5" width="417" height="657" rx="10" fill="none" stroke="#d0d0d0" stroke-width="2"/>
<text x="210.0" y="28" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f1f1f">2 · Switched sensor power</text>
<rect x="110" y="50" width="200" height="64" rx="8" fill="#e6f7ea" stroke="#2a9d3f" stroke-width="2"/>
<text x="210" y="76" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f1f1f">Heltec V3</text>
<text x="210" y="93" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">Vext = switched 3.3 V</text>
<text x="160" y="108" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">Vext</text>
<text x="260" y="108" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">GND</text>
<circle cx="160" cy="114" r="4.5" fill="#ffffff" stroke="#f08a00" stroke-width="2.5"/>
<circle cx="260" cy="114" r="4.5" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<polyline points="260,114 260,134" fill="none" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="250" y1="138" x2="270" y2="138" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="253.5" y1="143" x2="266.5" y2="143" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="257" y1="148" x2="263" y2="148" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<text x="300" y="128" font-size="11" text-anchor="start" font-weight="normal" fill="#555555">to GND</text>
<polyline points="160,114 160,160" fill="none" stroke="#f08a00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="95,200 95,160 285,160 285,200" fill="none" stroke="#f08a00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="160" cy="160" r="4.5" fill="#f08a00"/>
<text x="170" y="142" font-size="11" text-anchor="start" font-weight="normal" fill="#f08a00">3.3 V · on when GPIO36 = LOW</text>
<rect x="40" y="200" width="150" height="80" rx="8" fill="#eef3f8" stroke="#555555" stroke-width="2"/>
<text x="115" y="236" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f1f1f">MT3608 #1</text>
<text x="115" y="254" font-size="12" text-anchor="middle" font-weight="normal" fill="#d62828">set to 5.0 V</text>
<text x="95" y="216" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">IN +</text>
<text x="95" y="273" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">OUT +</text>
<text x="150" y="273" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">GND</text>
<circle cx="95" cy="200" r="4.5" fill="#ffffff" stroke="#f08a00" stroke-width="2.5"/>
<circle cx="95" cy="280" r="4.5" fill="#ffffff" stroke="#d62828" stroke-width="2.5"/>
<circle cx="150" cy="280" r="4.5" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<polyline points="150,280 150,300" fill="none" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="140" y1="304" x2="160" y2="304" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="143.5" y1="309" x2="156.5" y2="309" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="147" y1="314" x2="153" y2="314" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<rect x="230" y="200" width="150" height="80" rx="8" fill="#eef3f8" stroke="#555555" stroke-width="2"/>
<text x="305" y="236" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f1f1f">MT3608 #2</text>
<text x="305" y="254" font-size="12" text-anchor="middle" font-weight="normal" fill="#8a3ffc">set to about 15 V</text>
<text x="285" y="216" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">IN +</text>
<text x="285" y="273" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">OUT +</text>
<text x="340" y="273" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">GND</text>
<circle cx="285" cy="200" r="4.5" fill="#ffffff" stroke="#f08a00" stroke-width="2.5"/>
<circle cx="285" cy="280" r="4.5" fill="#ffffff" stroke="#8a3ffc" stroke-width="2.5"/>
<circle cx="340" cy="280" r="4.5" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<polyline points="340,280 340,300" fill="none" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="330" y1="304" x2="350" y2="304" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="333.5" y1="309" x2="346.5" y2="309" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="337" y1="314" x2="343" y2="314" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/>
<polyline points="95,280 95,340" fill="none" stroke="#d62828" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="285,280 285,340" fill="none" stroke="#8a3ffc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="340" width="180" height="122" rx="8" fill="#fdecec" stroke="#d62828" stroke-width="2"/>
<text x="110" y="364" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f1f1f">5 V rail</text>
<text x="110" y="389" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">→ SEN0189 turbidity (+)</text>
<text x="110" y="409" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">→ SEN0244 TDS / EC (+)</text>
<text x="110" y="429" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">→ JSN-SR04T (5V)</text>
<text x="110" y="452" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">sensor GND: any GND point</text>
<rect x="220" y="340" width="180" height="122" rx="8" fill="#f3ebff" stroke="#8a3ffc" stroke-width="2"/>
<text x="310" y="364" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f1f1f">~15 V rail</text>
<text x="310" y="389" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">→ TL-136 (+) only</text>
<text x="310" y="409" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">(4–20 mA loop supply)</text>
<text x="310" y="435" font-size="12" text-anchor="middle" font-weight="bold" fill="#d62828">NEVER to ADS1115</text>
<text x="310" y="452" font-size="12" text-anchor="middle" font-weight="bold" fill="#d62828">or the Heltec!</text>
<text x="18" y="495" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">1. Set each module with NOTHING on OUT +.</text>
<text x="18" y="513" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">2. Meter on OUT + and GND: 5.0 V / about 15 V.</text>
<text x="18" y="531" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">3. Turn the trimmer slowly (it may start at 28 V).</text>
<text x="18" y="549" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">4. IN − and OUT − are the same wire on the module.</text>
<text x="18" y="567" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">5. Expect 135–235 mA from Vext while measuring.</text>
<text x="18" y="585" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">6. XL6009 cannot be used: it needs 5 V or more in.</text>
<text x="18" y="622" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">All ground symbols are the same GND wire.</text>
<line x1="18" y1="634" x2="34" y2="634" stroke="#f08a00" stroke-width="4" stroke-linecap="round"/>
<text x="39" y="638" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">3.3 V</text>
<line x1="85.0" y1="634" x2="101.0" y2="634" stroke="#d62828" stroke-width="4" stroke-linecap="round"/>
<text x="106.0" y="638" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">5 V</text>
<line x1="139.2" y1="634" x2="155.2" y2="634" stroke="#8a3ffc" stroke-width="4" stroke-linecap="round"/>
<text x="160.2" y="638" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">~15 V</text>
<line x1="206.2" y1="634" x2="222.2" y2="634" stroke="#1f1f1f" stroke-width="4" stroke-linecap="round"/>
<text x="227.2" y="638" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">GND</text>
</svg>
