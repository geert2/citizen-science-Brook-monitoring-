<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 750" width="420" height="750" font-family="Helvetica, Arial, sans-serif">
<title>1 · Solar charging and battery</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="1.5" y="1.5" width="417" height="747" rx="10" fill="none" stroke="#d0d0d0" stroke-width="2"/>
<text x="210.0" y="28" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f1f1f">1 · Solar charging and battery</text>
<rect x="110" y="50" width="200" height="64" rx="8" fill="#e8f1ff" stroke="#1d6fdc" stroke-width="2"/>
<text x="210" y="76" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f1f1f">12 V solar panel</text>
<text x="210" y="94" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">about 10 W</text>
<polyline points="160,114 160,160" fill="none" stroke="#d62828" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="260,114 260,160" fill="none" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="172" y="142" font-size="14" text-anchor="start" font-weight="bold" fill="#1f1f1f">+</text>
<text x="272" y="142" font-size="14" text-anchor="start" font-weight="bold" fill="#1f1f1f">−</text>
<rect x="110" y="160" width="200" height="70" rx="8" fill="#fff4e0" stroke="#f08a00" stroke-width="2"/>
<text x="210" y="192" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f1f1f">CN3791 MPPT charger</text>
<text x="210" y="209" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">1 cell · 4.2 V</text>
<text x="160" y="175" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">IN +</text>
<text x="260" y="175" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">IN −</text>
<text x="210" y="224" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">BAT +</text>
<text x="270" y="224" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">BAT −</text>
<circle cx="160" cy="160" r="4.5" fill="#ffffff" stroke="#d62828" stroke-width="2.5"/>
<circle cx="260" cy="160" r="4.5" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<circle cx="210" cy="230" r="4.5" fill="#ffffff" stroke="#d62828" stroke-width="2.5"/>
<circle cx="270" cy="230" r="4.5" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<rect x="110" y="290" width="200" height="110" rx="8" fill="#f3f3f3" stroke="#555555" stroke-width="2"/>
<polyline points="125,305 295,305" fill="none" stroke="#d62828" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="125,385 295,385" fill="none" stroke="#1f1f1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="135" y="315" width="60" height="60" rx="6" fill="#ffffff" stroke="#555555" stroke-width="2"/>
<text x="165" y="341" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f1f1f">18650</text>
<text x="165" y="359" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">#1</text>
<polyline points="165,305 165,315" fill="none" stroke="#d62828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="165,375 165,385" fill="none" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="225" y="315" width="60" height="60" rx="6" fill="#ffffff" stroke="#555555" stroke-width="2"/>
<text x="255" y="341" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f1f1f">18650</text>
<text x="255" y="359" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">#2</text>
<polyline points="255,305 255,315" fill="none" stroke="#d62828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="255,375 255,385" fill="none" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="210" y="418" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f1f1f">2 × 18650 cells in PARALLEL</text>
<text x="210" y="435" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">protected cells · never in series</text>
<polyline points="210,230 210,305" fill="none" stroke="#d62828" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="210" cy="305" r="4.5" fill="#d62828"/>
<polyline points="270,230 270,248 350,248 350,470 270,470 270,500" fill="none" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="350,385 295,385" fill="none" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="350" cy="385" r="4.5" fill="#1f1f1f"/>
<polyline points="125,305 96,305 96,470 150,470 150,500" fill="none" stroke="#d62828" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="88" y="372" width="16" height="34" rx="3" fill="#fff3cd" stroke="#b58900" stroke-width="2"/>
<text x="82" y="394" font-size="12" text-anchor="end" font-weight="normal" fill="#1f1f1f">2 A fuse</text>
<rect x="90" y="500" width="240" height="86" rx="8" fill="#e6f7ea" stroke="#2a9d3f" stroke-width="2"/>
<text x="150" y="515" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">BAT +</text>
<text x="270" y="515" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f1f1f">BAT −</text>
<text x="210" y="540" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f1f1f">Heltec WiFi LoRa 32 V3</text>
<text x="210" y="558" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f1f1f">battery connector (JST 1.25)</text>
<text x="210" y="576" font-size="12" text-anchor="middle" font-weight="normal" fill="#d62828">check the polarity first!</text>
<circle cx="150" cy="500" r="4.5" fill="#ffffff" stroke="#d62828" stroke-width="2.5"/>
<circle cx="270" cy="500" r="4.5" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<text x="18" y="620" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• Cells in parallel: + to +, − to −.  CN3791 = 1 cell.</text>
<text x="18" y="638" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• Set the CN3791 MPPT voltage to about 80 % of the</text>
<text x="18" y="656" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">  panel open-circuit voltage.</text>
<text x="18" y="674" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• Do not charge Li-ion below 0 °C.</text>
<text x="18" y="692" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">• Attach the antenna BEFORE powering the Heltec.</text>
<line x1="18" y1="724" x2="34" y2="724" stroke="#d62828" stroke-width="4" stroke-linecap="round"/>
<text x="39" y="728" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">+ battery</text>
<line x1="110.6" y1="724" x2="126.6" y2="724" stroke="#1f1f1f" stroke-width="4" stroke-linecap="round"/>
<text x="131.6" y="728" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">GND / −</text>
</svg>
