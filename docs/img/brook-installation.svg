<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="650" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#222">Brook lite station - installation cross-section</text>
<text x="24" y="56" font-size="13" fill="#555">The probes sit in a perforated stilling pipe; the box and air sensor stay above the highest known flood level.</text>
<!-- sky / bank / bed -->
<path d="M0 300 L300 300 L420 520 L760 520 L860 330 L1000 330 L1000 640 L0 640 Z" fill="#d7ccc8" stroke="#8d6e63" stroke-width="2"/>
<!-- water -->
<path d="M358 420 L420 520 L760 520 L813 420 Z" fill="#bbdefb" stroke="none"/>
<line x1="352" y1="420" x2="820" y2="420" stroke="#1565c0" stroke-width="2.5"/>
<text x="600" y="412" font-size="12" text-anchor="middle" fill="#1565c0">water surface</text>
<line x1="320" y1="350" x2="845" y2="350" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="600" y="343" font-size="12" text-anchor="middle" fill="#1565c0">highest known flood level</text>
<!-- post + box -->
<rect x="150" y="150" width="12" height="190" fill="#8d6e63"/>
<rect x="95" y="175" width="70" height="60" rx="5" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
<text x="130" y="202" font-size="11" text-anchor="middle" font-weight="bold" fill="#222">IP65 box</text>
<text x="130" y="217" font-size="10" text-anchor="middle" fill="#222">Heltec V3</text>
<text x="130" y="230" font-size="10" text-anchor="middle" fill="#222">+ batteries</text>
<line x1="130" y1="175" x2="130" y2="140" stroke="#222" stroke-width="2"/>
<text x="130" y="134" font-size="10" text-anchor="middle" fill="#222">antenna</text>
<!-- radiation shield -->
<g fill="#ffffff" stroke="#455a64" stroke-width="1.5">
<rect x="190" y="160" width="46" height="6" rx="2"/><rect x="190" y="170" width="46" height="6" rx="2"/><rect x="190" y="180" width="46" height="6" rx="2"/><rect x="190" y="190" width="46" height="6" rx="2"/>
</g>
<line x1="162" y1="178" x2="190" y2="178" stroke="#455a64" stroke-width="2"/>
<text x="213" y="152" font-size="10" text-anchor="middle" fill="#222">BME280 in shield</text>
<!-- stilling pipe along the bank slope -->
<line x1="300" y1="286" x2="414" y2="498" stroke="#2e7d32" stroke-width="22" stroke-linecap="butt"/>
<line x1="300" y1="286" x2="414" y2="498" stroke="#e8f5e9" stroke-width="17" stroke-linecap="butt"/>
<g fill="#2e7d32"><circle cx="330" cy="342" r="2.6"/><circle cx="345" cy="370" r="2.6"/><circle cx="360" cy="398" r="2.6"/><circle cx="375" cy="426" r="2.6"/><circle cx="390" cy="454" r="2.6"/><circle cx="403" cy="478" r="2.6"/></g>
<!-- cable from the box into the pipe -->
<path d="M150 235 C 200 270, 260 280, 302 290 L 405 482" fill="none" stroke="#222" stroke-width="2.5"/>
<text x="176" y="252" font-size="10" fill="#222">cables in conduit</text>
<text x="176" y="265" font-size="10" fill="#222">(vent tube open in the box)</text>
<!-- sensor bundle at the lower end, inside the pipe -->
<rect x="398" y="478" width="14" height="22" rx="3" fill="#1565c0" transform="rotate(-28 405 489)"/>
<line x1="400" y1="495" x2="330" y2="560" stroke="#222" stroke-width="1"/>
<text x="210" y="572" font-size="11" font-weight="bold" fill="#222">sensor bundle: TL-136, DS18B20, EC</text>
<text x="210" y="586" font-size="10" fill="#222">inside the pipe end, 5-10 cm above the bed</text>
<line x1="350" y1="360" x2="470" y2="300" stroke="#2e7d32" stroke-width="1"/>
<text x="474" y="296" font-size="11" font-weight="bold" fill="#2e7d32">perforated PVC stilling pipe</text>
<text x="474" y="310" font-size="10" fill="#2e7d32">40-50 mm, staked to the bank slope</text>
<!-- staff gauge -->
<rect x="700" y="360" width="14" height="160" fill="#fff59d" stroke="#f57f17" stroke-width="1.5"/>
<g stroke="#222" stroke-width="1"><line x1="700" y1="380" x2="708" y2="380"/><line x1="700" y1="400" x2="708" y2="400"/><line x1="700" y1="420" x2="708" y2="420"/><line x1="700" y1="440" x2="708" y2="440"/><line x1="700" y1="460" x2="708" y2="460"/><line x1="700" y1="480" x2="708" y2="480"/><line x1="700" y1="500" x2="708" y2="500"/></g>
<text x="722" y="372" font-size="11" font-weight="bold" fill="#222">staff gauge</text>
<line x1="420" y1="510" x2="714" y2="510" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="722" y="514" font-size="11" fill="#c62828">gauge zero</text>
<!-- dimensions -->
<line x1="412" y1="490" x2="610" y2="490" stroke="#222" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="560" y1="420" x2="560" y2="490" stroke="#222" stroke-width="1.2"/>
<line x1="554" y1="420" x2="566" y2="420" stroke="#222"/><line x1="554" y1="490" x2="566" y2="490" stroke="#222"/>
<text x="568" y="459" font-size="11" fill="#222">water above sensor</text>
<line x1="600" y1="490" x2="600" y2="510" stroke="#c62828" stroke-width="1.5"/>
<text x="606" y="505" font-size="12" font-weight="bold" fill="#c62828">H</text>
<text x="590" y="545" font-size="12" text-anchor="middle" fill="#6d4c41">brook bed (silt)</text>
<!-- formula -->
<rect x="24" y="596" width="952" height="40" rx="6" fill="#f5f5f5" stroke="#bdbdbd"/>
<text x="40" y="613" font-size="13" font-weight="bold" fill="#222">Water level on the staff gauge = water above sensor (TL-136) + H</text>
<text x="40" y="629" font-size="11" fill="#555">H = sensor height above gauge zero (negative if below). It is a number in Home Assistant: re-measure it whenever the pipe or probe moves.</text>
</svg>
