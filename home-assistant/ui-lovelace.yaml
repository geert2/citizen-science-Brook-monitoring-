# De Meetbeek - Lovelace dashboard (raw configuration mode)
# Entity IDs assume the ESPHome devices are named as in esphome/*.yaml
# (friendly_name "De Meetbeek"). If a card shows "Entity not available", look up
# the real ID in Home Assistant > Developer tools > States and adjust it here.
title: De Meetbeek
views:
  - title: Water
    icon: mdi:water
    cards:
      - type: gauge
        entity: sensor.de_meetbeek_water_level
        name: Water level
        unit: m
        min: 0
        max: 1
        severity: {green: 0, yellow: 0.5, red: 0.8}

      - type: gauge
        entity: sensor.de_meetbeek_ec
        name: Conductivity (25 °C)
        unit: µS/cm
        min: 0
        max: 2000
        severity: {green: 0, yellow: 900, red: 1400}

      - type: gauge
        entity: sensor.de_meetbeek_turbidity
        name: Turbidity (index)
        unit: NTU
        min: 0
        max: 500
        severity: {green: 0, yellow: 50, red: 150}

      - type: entities
        title: Current values
        entities:
          - sensor.de_meetbeek_water_temperature
          - sensor.de_meetbeek_ultrasonic_level
          - sensor.de_meetbeek_node_battery

      - type: history-graph
        title: Level - pressure sensor vs ultrasonic (should agree)
        hours_to_show: 48
        entities:
          - sensor.de_meetbeek_water_level
          - sensor.de_meetbeek_ultrasonic_level

      - type: history-graph
        title: Conductivity and turbidity (7 days)
        hours_to_show: 168
        entities:
          - sensor.de_meetbeek_ec
          - sensor.de_meetbeek_turbidity

  - title: Air
    icon: mdi:air-filter
    cards:
      - type: gauge
        entity: sensor.de_meetbeek_pm2_5
        name: PM2.5
        unit: µg/m³
        min: 0
        max: 100
        severity: {green: 0, yellow: 15, red: 35}

      - type: gauge
        entity: sensor.de_meetbeek_pm10
        name: PM10
        unit: µg/m³
        min: 0
        max: 200
        severity: {green: 0, yellow: 45, red: 90}

      - type: entities
        title: Weather at the sensor
        entities:
          - sensor.de_meetbeek_air_temperature
          - sensor.de_meetbeek_humidity
          - sensor.de_meetbeek_pressure

      - type: history-graph
        title: Particulate matter (24 h)
        hours_to_show: 24
        entities:
          - sensor.de_meetbeek_pm2_5
          - sensor.de_meetbeek_pm10
          - sensor.de_meetbeek_humidity

  - title: System health
    icon: mdi:heart-pulse
    cards:
      - type: entities
        title: Link and data quality
        entities:
          - binary_sensor.de_meetbeek_node_online
          - sensor.de_meetbeek_node_battery
          - sensor.de_meetbeek_qc_flags
          - sensor.de_meetbeek_readings_lost
          - sensor.de_meetbeek_node_resets
          - sensor.de_meetbeek_lora_rssi
          - sensor.de_meetbeek_lora_snr
          - sensor.de_meetbeek_level_loop_current
          - sensor.de_meetbeek_ec_raw_voltage
          - sensor.de_meetbeek_turbidity_raw_voltage

      - type: history-graph
        title: Battery and signal (7 days)
        hours_to_show: 168
        entities:
          - sensor.de_meetbeek_node_battery
          - sensor.de_meetbeek_lora_rssi

      - type: markdown
        title: QC flags (sum of the active bits)
        content: >
          **1** level loop out of range or wire break · **2** EC out of range ·
          **4** turbidity invalid · **8** water temperature invalid ·
          **16** no ultrasonic echo · **32** low battery (&lt;3.3 V) ·
          **64** EC not yet calibrated · **128** turbidity not yet calibrated
