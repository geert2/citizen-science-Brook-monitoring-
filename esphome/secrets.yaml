# ESPHome Secrets Template
# COPY THIS FILE TO secrets.yaml AND FILL IN YOUR VALUES
# DO NOT COMMIT secrets.yaml TO GIT - it contains sensitive information!

# Wi-Fi Credentials
wifi_ssid: "YourWiFiSSID"
wifi_password: "YourWiFiPassword"

# MQTT Broker Credentials
mqtt_broker: "192.168.1.10"  # IP address or hostname of your MQTT broker
mqtt_user: "mqtt_user"
mqtt_password: "mqtt_password"

# sensor.community API (if needed)
sensor_community_id: "your_sensor_id"
