# =============================================================================
# De Meetbeek - WATER SENSOR NODE
# Board  : Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
# Sensors: TL-136 level (4-20 mA), DS18B20 water temperature,
#          DFRobot SEN0244 analog TDS/EC sensor, DFRobot SEN0189 turbidity,
#          JSN-SR04T ultrasonic  (+ ADS1115 16-bit ADC)
# Radio  : raw LoRa (EU 868 MHz band) -> gateway. No Wi-Fi, no API (battery node).
# Power  : 2x18650 (parallel) + CN3791 + 12 V solar panel
#
# HOW IT WORKS
#   1. Node wakes from deep sleep, powers the sensors, takes ${samples} readings.
#   2. It sends the RAW values (volts, deg C, metres) in one small text packet.
#   3. It goes back to sleep. All calibration happens in the GATEWAY, so you
#      can re-calibrate without climbing down to the stream.
#
# Payload format (version "B1"), ASCII, comma separated:
#   B1,seq,vbat,water_temp,v_loop,v_ec,v_turb,dist_m      (-999 = no reading)
#
# FLASHING: by USB cable (this node is asleep, so no OTA).
# Requires ESPHome >= 2025.7 (sx126x component). Pins: see docs/wiring.md
# =============================================================================

substitutions:
  node_name: brook-water-node
  friendly: "De Meetbeek Water Node"

  # --- Radio: MUST be identical in the gateway file ---------------------------
  # 869.525 MHz lies in the 869.4-869.65 MHz sub-band (10 % duty cycle).
  # Use 868100000 for the 1 % sub-band if you prefer (then keep SF <= 9).
  lora_frequency_hz: "869525000"
  lora_spreading_factor: "9"     # 7 = short range/fast ... 12 = long range/slow
  lora_tx_power_dbm: "14"        # keep power + antenna gain within local EIRP limits

  # --- Timing ------------------------------------------------------------------
  sleep_time: 5min               # time between measurements
  samples: "5"                   # readings per wake-up (the median is sent)

  # --- Heltec V3 battery sense (on-board divider) ------------------------------
  vbat_divider: "4.9"            # (390k + 100k) / 100k. Tune with a multimeter.
  vbat_ctrl_inverted: "true"     # true = GPIO37 LOW enables the divider (V3/V3.1).
                                 # If battery reads ~0 V, try "false" (some V3.2).

esphome:
  name: ${node_name}
  friendly_name: ${friendly}
  on_boot:
    priority: -100
    then:
      - script.execute: measure_and_send

esp32:
  board: heltec_wifi_lora_32_V3
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: INFO

# Failsafe: whatever happens, never stay awake longer than 40 s.
deep_sleep:
  id: deep_sleep_1
  run_duration: 40s
  sleep_duration: ${sleep_time}

globals:
  - id: tx_payload
    type: std::string
    initial_value: '""'

# --- LoRa radio (SX1262 on the Heltec V3: these pins are fixed on the board) --
spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

sx126x:
  id: radio
  cs_pin: GPIO8
  rst_pin: GPIO12
  busy_pin: GPIO13
  dio1_pin: GPIO14
  hw_version: sx1262
  frequency: ${lora_frequency_hz}
  modulation: LORA
  bandwidth: 125_0kHz
  spreading_factor: ${lora_spreading_factor}
  coding_rate: CR_4_6
  preamble_size: 8
  sync_value: [0x14, 0x24]       # private network sync word
  crc_enable: true
  pa_power: ${lora_tx_power_dbm}
  rf_switch: true
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms

# --- External buses ---------------------------------------------------------
i2c:
  sda: GPIO41
  scl: GPIO42
  frequency: 100kHz

one_wire:
  - platform: gpio
    pin: GPIO5

ads1115:
  - address: 0x48
    id: ads

# --- Power switches ---------------------------------------------------------
switch:
  # Heltec "Vext": the board's OWN switched 3.3 V output (LOW = on, about 350 mA max).
  # It powers the two MT3608 boosters: ~15 V (TL-136 loop) and 5 V (SEN0189
  # turbidity, SEN0244 TDS/EC, JSN-SR04T). No external MOSFET needed. See docs/wiring.md
  - platform: gpio
    id: boost_enable
    pin:
      number: GPIO36
      inverted: true
    restore_mode: ALWAYS_OFF
    internal: true
  # Enables the on-board battery voltage divider
  - platform: gpio
    id: vbat_divider_enable
    pin:
      number: GPIO37
      inverted: ${vbat_ctrl_inverted}
    restore_mode: ALWAYS_OFF
    internal: true

# --- Sensors (all polled manually by the script below) -----------------------
sensor:
  - platform: dallas_temp
    id: ds_water_temp
    update_interval: never
    resolution: 12
    filters:
      - median:
          window_size: ${samples}
          send_every: ${samples}
          send_first_at: ${samples}

  # TL-136 4-20 mA loop: voltage across the shunt resistor (A0)
  - platform: ads1115
    ads1115_id: ads
    id: ads_loop
    multiplexer: A0_GND
    gain: 4.096
    sample_rate: 128
    update_interval: never
    filters:
      - median:
          window_size: ${samples}
          send_every: ${samples}
          send_first_at: ${samples}

  # SEN0244 TDS/EC sensor analog output, 0-2.3 V (A1)
  - platform: ads1115
    ads1115_id: ads
    id: ads_ec
    multiplexer: A1_GND
    gain: 4.096
    sample_rate: 128
    update_interval: never
    filters:
      - median:
          window_size: ${samples}
          send_every: ${samples}
          send_first_at: ${samples}

  # SEN0189 turbidity analog output (up to 4.5 V) AFTER the 2:1 divider (A2)
  - platform: ads1115
    ads1115_id: ads
    id: ads_turb
    multiplexer: A2_GND
    gain: 4.096
    sample_rate: 128
    update_interval: never
    filters:
      - median:
          window_size: ${samples}
          send_every: ${samples}
          send_first_at: ${samples}

  # JSN-SR04T ultrasonic. ESPHome reports METRES (assuming a fixed speed of sound).
  - platform: ultrasonic
    trigger_pin: GPIO6
    echo_pin: GPIO7
    id: us_dist
    pulse_time: 20us
    timeout: 3m
    update_interval: never
    filters:
      - median:
          window_size: ${samples}
          send_every: ${samples}
          send_first_at: ${samples}

  # Battery voltage through the Heltec on-board divider (GPIO1)
  - platform: adc
    pin: GPIO1
    id: vbat_adc
    attenuation: 6db
    samples: 8
    update_interval: never
    filters:
      - median:
          window_size: ${samples}
          send_every: ${samples}
          send_first_at: ${samples}
      - multiply: ${vbat_divider}

# --- Measurement + transmit sequence ----------------------------------------
script:
  - id: measure_and_send
    mode: single
    then:
      - switch.turn_on: boost_enable
      - switch.turn_on: vbat_divider_enable
      - delay: 3s                      # let probes and boosters settle
      - repeat:
          count: ${samples}
          then:
            - component.update: ds_water_temp
            - component.update: ads_loop
            - delay: 150ms
            - component.update: ads_ec
            - delay: 150ms
            - component.update: ads_turb
            - delay: 150ms
            - component.update: vbat_adc
            - component.update: us_dist
            - delay: 700ms
      - delay: 500ms
      - switch.turn_off: boost_enable
      - switch.turn_off: vbat_divider_enable
      - lambda: |-
          // Sequence number survives deep sleep (RTC memory) and restarts at 0
          // after a power loss, which the gateway reports as a "node reset".
          static RTC_DATA_ATTR uint32_t seq = 0;
          seq++;
          auto v = [](float x) { return std::isnan(x) ? -999.0f : x; };
          char buf[120];
          snprintf(buf, sizeof(buf), "B1,%u,%.3f,%.2f,%.4f,%.4f,%.4f,%.3f",
                   (unsigned int) seq,
                   v(id(vbat_adc).state),
                   v(id(ds_water_temp).state),
                   v(id(ads_loop).state),
                   v(id(ads_ec).state),
                   v(id(ads_turb).state),
                   v(id(us_dist).state));
          id(tx_payload) = buf;
          ESP_LOGI("brook", "TX: %s", buf);
      # Every reading is sent twice (raw LoRa has no ACK); the gateway drops duplicates.
      - sx126x.send_packet:
          data: !lambda 'return std::vector<uint8_t>(id(tx_payload).begin(), id(tx_payload).end());'
      - delay: 1500ms
      - sx126x.send_packet:
          data: !lambda 'return std::vector<uint8_t>(id(tx_payload).begin(), id(tx_payload).end());'
      - delay: 500ms
      - sx126x.set_mode_sleep:
          cold: true
      - deep_sleep.enter:
          id: deep_sleep_1
