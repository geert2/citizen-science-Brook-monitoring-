# =============================================================================
# De Meetbeek - AIR QUALITY NODE
# Board  : ESP32 DevKit (classic ESP32, e.g. ESP32-DevKitC / "ESP32 DOIT")
# Sensors: SDS011 particulate sensor (UART), BME280 temperature/humidity/pressure (I2C)
# Link   : Wi-Fi -> Home Assistant (API), MQTT (optional), sensor.community
# Power  : 5 V USB supply (mains). Wi-Fi + SDS011 draw too much for a small
#          solar/battery system in winter. The ESP32 board and the SDS011 are
#          both fed from the same 5 V supply. No boost converter needed.
#
# sensor.community: register the sensor at https://devices.sensor.community and
# put the sensor ID you get there in "sc_sensor_id" below.
# The SDS011 is posted as pin 1, the BME280 as pin 11 (their documented pins).
# =============================================================================

substitutions:
  device_name: brook-air-quality
  friendly: "De Meetbeek"

  sc_sensor_id: "esp32-REPLACE_ME"   # ID you registered at devices.sensor.community
  sds_interval: 5min                 # SDS011 sleeps between measurements (fan/laser life)

esphome:
  name: ${device_name}
  friendly_name: ${friendly}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "brook-air-fallback"
    password: !secret ap_password

captive_portal:

# Optional open-data output. Delete this block if you do not run an MQTT broker.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: brook/air
  discovery: false

# TLS to api.sensor.community. If you see certificate errors in the log,
# set verify_ssl: false (the data is public anyway).
http_request:
  timeout: 10s
  verify_ssl: true

# SDS011: ESP32 RX (GPIO16) <- SDS011 TX ; ESP32 TX (GPIO17) -> SDS011 RX
uart:
  id: uart_sds
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: sds011
    uart_id: uart_sds
    update_interval: ${sds_interval}
    pm_2_5:
      name: "PM2.5"
      id: pm25
    pm_10_0:
      name: "PM10"
      id: pm10
      on_value:
        then:
          - script.execute: post_to_sensor_community

  - platform: bme280_i2c
    address: 0x76                    # try 0x77 if the I2C scan does not find it
    update_interval: 60s
    temperature:
      name: "Air Temperature"
      id: air_temp
    humidity:
      name: "Humidity"
      id: air_hum
    pressure:
      name: "Pressure"
      id: air_pressure

script:
  - id: post_to_sensor_community
    mode: single
    then:
      - delay: 2s                    # make sure PM2.5 and PM10 are both updated
      - if:
          condition:
            lambda: 'return id(pm25).has_state() && id(pm10).has_state();'
          then:
            # --- SDS011 (pin 1): P1 = PM10, P2 = PM2.5. Raw values, no smoothing. ---
            - http_request.post:
                url: https://api.sensor.community/v1/push-sensor-data/
                request_headers:
                  Content-Type: application/json
                  X-Pin: "1"
                  X-Sensor: ${sc_sensor_id}
                body: !lambda |-
                  char buf[200];
                  snprintf(buf, sizeof(buf),
                           "{\"software_version\":\"esphome-meetbeek-1\",\"sensordatavalues\":["
                           "{\"value_type\":\"P1\",\"value\":\"%.2f\"},"
                           "{\"value_type\":\"P2\",\"value\":\"%.2f\"}]}",
                           id(pm10).state, id(pm25).state);
                  return std::string(buf);
                on_response:
                  then:
                    - logger.log:
                        format: "sensor.community (SDS011) HTTP %d"
                        args: ['response->status_code']
      - delay: 3s
      - if:
          condition:
            lambda: 'return id(air_temp).has_state() && id(air_hum).has_state() && id(air_pressure).has_state();'
          then:
            # --- BME280 (pin 11): pressure must be in Pa ---
            - http_request.post:
                url: https://api.sensor.community/v1/push-sensor-data/
                request_headers:
                  Content-Type: application/json
                  X-Pin: "11"
                  X-Sensor: ${sc_sensor_id}
                body: !lambda |-
                  char buf[260];
                  snprintf(buf, sizeof(buf),
                           "{\"software_version\":\"esphome-meetbeek-1\",\"sensordatavalues\":["
                           "{\"value_type\":\"temperature\",\"value\":\"%.2f\"},"
                           "{\"value_type\":\"pressure\",\"value\":\"%.2f\"},"
                           "{\"value_type\":\"humidity\",\"value\":\"%.2f\"}]}",
                           id(air_temp).state, id(air_pressure).state * 100.0f, id(air_hum).state);
                  return std::string(buf);
                on_response:
                  then:
                    - logger.log:
                        format: "sensor.community (BME280) HTTP %d"
                        args: ['response->status_code']
